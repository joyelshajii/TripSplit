<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="coinGoldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="coinGoldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg4)"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <!-- Left Sliced Half of Coin (shifted slightly top-left) -->
  <g transform="translate(-1.5, -1.5)">
    <!-- Upper-Left Semi-Circle Sector -->
    <path d="M 17.8 17.8 A 20 20 0 0 1 43.5 14.5 L 14.5 43.5 A 20 20 0 0 1 17.8 17.8 Z" fill="url(#coinGoldLeft)"/>
    <!-- Inner Rim Detail -->
    <path d="M 21 21 A 15 15 0 0 1 40 18.5 L 18.5 40 A 15 15 0 0 1 21 21 Z" fill="none" stroke="#FEF08A" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Right Sliced Half of Coin (shifted slightly bottom-right) -->
  <g transform="translate(1.5, 1.5)">
    <!-- Lower-Right Semi-Circle Sector -->
    <path d="M 46.2 46.2 A 20 20 0 0 1 20.5 49.5 L 49.5 20.5 A 20 20 0 0 1 46.2 46.2 Z" fill="url(#coinGoldRight)"/>
    <!-- Inner Rim Detail -->
    <path d="M 43 43 A 15 15 0 0 1 24 45.5 L 45.5 24 A 15 15 0 0 1 43 43 Z" fill="none" stroke="#FEF08A" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Center Paired Division Dots -->
  <circle cx="28" cy="24" r="2.5" fill="#0A0A0A"/>
  <circle cx="28" cy="24" r="1.5" fill="#FFFFFF"/>
  <circle cx="36" cy="40" r="2.5" fill="#0A0A0A"/>
  <circle cx="36" cy="40" r="1.5" fill="#FEF08A"/>
</svg>
